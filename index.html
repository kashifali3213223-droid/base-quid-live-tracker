<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QUID Live Tracker</title>
  <style>
    :root {
      --bg: #090b10;
      --panel: #111622;
      --panel2: #151a28;
      --border: #252d3d;
      --text: #f4f6fb;
      --muted: #8f99ad;
      --green: #52e08c;
      --red: #ff5c67;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 16px 50px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:18px; }
    h1 { margin:0; font-size:28px; }
    .sub { color:var(--muted); margin-top:5px; }
    .status {
      border:1px solid var(--border); border-radius:999px; padding:9px 13px;
      white-space:nowrap;
    }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:7px; background:var(--red); }
    .live .dot { background:var(--green); }
    .cards { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin:20px 0 14px; }
    .card, .search, .tablebox { background:var(--panel); border:1px solid var(--border); border-radius:18px; }
    .card { padding:20px; }
    .label { color:var(--muted); font-size:13px; text-transform:uppercase; }
    .value { font-size:34px; font-weight:750; margin-top:7px; }
    .search { padding:18px; margin-bottom:14px; }
    input {
      width:100%; padding:13px 14px; margin-top:8px; border-radius:10px;
      border:1px solid var(--border); background:var(--panel2); color:var(--text);
      font-size:15px;
    }
    button {
      margin-top:10px; padding:12px 18px; border:0; border-radius:10px;
      background:#777; color:white; font-weight:700; cursor:pointer;
    }
    .result { margin-top:10px; color:var(--muted); }
    .tablebox { overflow:hidden; }
    .tablehead { padding:18px; font-size:16px; font-weight:700; }
    .scroll { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:720px; }
    th, td { padding:12px 14px; border-top:1px solid var(--border); text-align:left; font-size:13px; }
    th { color:var(--muted); font-weight:600; }
    td:nth-child(1), th:nth-child(1) { width:70px; }
    .wallet { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
    .foot { color:var(--muted); font-size:12px; padding:12px 18px 18px; }
    @media (max-width:650px) {
      .wrap { padding:14px 10px 35px; }
      h1 { font-size:23px; }
      .cards { grid-template-columns:1fr; }
      .value { font-size:29px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🔥 QUID Live Tracker</h1>
      <div class="sub">PancakeSwap V3 · QUID pairs · live wallet volume</div>
    </div>
    <div id="status" class="status"><span class="dot"></span><span>OFFLINE</span></div>
  </header>

  <section class="cards">
    <div class="card">
      <div class="label">Total Wallets</div>
      <div id="wallets" class="value">0</div>
    </div>
    <div class="card">
      <div class="label">Total Volume USD</div>
      <div id="volume" class="value">$0.00</div>
    </div>
  </section>

  <section class="search">
    <div class="label">Search Wallet</div>
    <input id="address" placeholder="0x wallet address">
    <button onclick="searchWallet()">Search</button>
    <div id="result" class="result"></div>
  </section>

  <section class="tablebox">
    <div class="tablehead">LIVE WALLET RANKING</div>
    <div class="scroll">
      <table>
        <thead>
          <tr><th>Rank</th><th>Wallet</th><th>Swaps</th><th>Volume USD</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="foot">Updates automatically every 3 seconds.</div>
  </section>
</div>

<script>
  const money = n => '$' + Number(n || 0).toLocaleString(undefined, {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });

  async function refresh() {
    try {
      const r = await fetch('/api/stats', {cache:'no-store'});
      const d = await r.json();

      document.getElementById('wallets').textContent = d.total_wallets;
      document.getElementById('volume').textContent = money(d.total_volume_usd);

      const status = document.getElementById('status');
      status.className = 'status' + (d.tracker_running ? ' live' : '');
      status.querySelector('span:last-child').textContent =
        d.tracker_running ? 'LIVE' : 'OFFLINE';

      document.getElementById('rows').innerHTML = d.wallets.map(w => `
        <tr>
          <td>#${w.rank}</td>
          <td class="wallet">${w.wallet}</td>
          <td>${w.swaps}</td>
          <td>${money(w.volume_usd)}</td>
        </tr>
      `).join('');
    } catch (e) {
      const status = document.getElementById('status');
      status.className = 'status';
      status.querySelector('span:last-child').textContent = 'OFFLINE';
    }
  }

  async function searchWallet() {
    const address = document.getElementById('address').value.trim();
    const result = document.getElementById('result');

    if (!address) {
      result.textContent = 'Enter a wallet address.';
      return;
    }

    try {
      const r = await fetch('/api/wallet?address=' + encodeURIComponent(address));
      const d = await r.json();

      if (!d.found) {
        result.textContent = 'Wallet not found in current tracker data.';
        return;
      }

      result.textContent =
        `Swaps: ${d.swaps} · Volume: ${money(d.volume_usd)}`;
    } catch (e) {
      result.textContent = 'Search failed.';
    }
  }

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
